{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<style>
  /* 隐藏顶部的导航栏，让登录页面成为全屏聚焦模式 */
  .topbar { display: none !important; }
  
  /* 调整 shell 以便上下左右居中 */
  .shell {
    margin: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    min-height: 100vh !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 2rem !important;
  }
  
  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 2.5rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(40, 36, 29, 0.08);
  }
  
  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .login-header svg {
    color: var(--accent);
    margin-bottom: 1rem;
  }
  
  .login-header h1 {
    font-size: 24px;
    margin-bottom: 0.5rem;
  }
  
  .login-header p {
    font-size: 13px;
    margin: 0;
  }
  
  .login-card label {
    margin-top: 1rem;
  }
  
  .login-card label:first-of-type {
    margin-top: 0;
  }
  
  .login-card button {
    width: 100%;
    margin-top: 1.5rem;
    height: 44px;
    font-size: 15px;
  }
  
  .form-errors {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
  }
</style>

<div class="login-card">
  <div class="login-header">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h1>登录 STRM 后台</h1>
    <p class="muted">默认账号 <span class="mono">admin</span> / <span class="mono">admin</span></p>
  </div>
  
  {% if error %}
    <div class="form-errors">{{ error }}</div>
  {% endif %}
  
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" autofocus placeholder="输入用户名">
    
    <label for="password" style="margin-top: 1.25rem;">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码">
    
    <button type="submit">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      登录
    </button>
  </form>
</div>
{% endblock %}
