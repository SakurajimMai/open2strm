name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep latest 5 GHCR versions
        uses: actions/github-script@v9
        with:
          script: |
            const keep = 5;
            const owner = context.repo.owner;
            const ownerType = context.payload.repository.owner.type;
            const packageName = context.repo.repo.toLowerCase();
            const isOrg = ownerType === "Organization";

            const listRoute = isOrg
              ? "GET /orgs/{org}/packages/{package_type}/{package_name}/versions"
              : "GET /users/{username}/packages/{package_type}/{package_name}/versions";
            const deleteRoute = isOrg
              ? "DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}"
              : "DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}";
            const ownerParams = isOrg ? { org: owner } : { username: owner };

            const versions = await github.paginate(listRoute, {
              ...ownerParams,
              package_type: "container",
              package_name: packageName,
              per_page: 100,
            });

            versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const staleVersions = versions.slice(keep);

            core.info(`Found ${versions.length} package versions, deleting ${staleVersions.length}.`);
            for (const version of staleVersions) {
              core.info(`Deleting package version ${version.id} created at ${version.created_at}.`);
              await github.request(deleteRoute, {
                ...ownerParams,
                package_type: "container",
                package_name: packageName,
                package_version_id: version.id,
              });
            }
